# Speed: spot instances are on the clock from the moment they boot —
# every minute of deploy is reclaim exposure, so parallelize hard.
[defaults]
forks = 16
gathering = smart
host_key_checking = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=accept-new
