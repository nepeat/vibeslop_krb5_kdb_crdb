# Example inventory: 3 regions x 3 nodes. The region topology IS the
# inventory — crdb_region/crdb_zone hostvars drive --locality, the
# cross-region --join list, and the generated multi-region DDL
# (PRIMARY REGION / REGIONS / SURVIVE REGION FAILURE).
#
# crdb_advertise defaults to ansible_host; override it when nodes should
# advertise a different (e.g. WireGuard mesh) address.

[crdb]
crdb-sea-0 ansible_host=10.10.1.10 crdb_region=sea1 crdb_zone=a
crdb-sea-1 ansible_host=10.10.1.11 crdb_region=sea1 crdb_zone=b
crdb-sea-2 ansible_host=10.10.1.12 crdb_region=sea1 crdb_zone=c
crdb-ord-0 ansible_host=10.20.1.10 crdb_region=ord1 crdb_zone=a
crdb-ord-1 ansible_host=10.20.1.11 crdb_region=ord1 crdb_zone=b
crdb-ord-2 ansible_host=10.20.1.12 crdb_region=ord1 crdb_zone=c
crdb-fra-0 ansible_host=10.30.1.10 crdb_region=fra1 crdb_zone=a
crdb-fra-1 ansible_host=10.30.1.11 crdb_region=fra1 crdb_zone=b
crdb-fra-2 ansible_host=10.30.1.12 crdb_region=fra1 crdb_zone=c

# KDCs — colocated on the first CRDB node of each region here (the AWS
# rig does the same); dedicated hosts work too, they just need a
# crdb_region hostvar so kdc.conf picks region-local CRDB nodes.
[kdc]
crdb-sea-0
crdb-ord-0
crdb-fra-0
