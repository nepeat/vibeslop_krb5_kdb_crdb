# krb5kdc (and kadmind on the admin host) as podman quadlet units running
# the nix-built image. Config, CRDB client certs, and the master stash are
# host files mounted in; the image itself carries no realm state.
---
- name: Assert region-local CRDB nodes exist
  ansible.builtin.assert:
    that: _matches | int > 0
    fail_msg: >-
      no [crdb] hosts in region '{{ crdb_region | default('(any)') }}'
      for {{ inventory_hostname }}
  vars:
    _matches: >-
      {{ groups['crdb'] | default([])
         | map('extract', hostvars)
         | selectattr('crdb_region', 'defined')
         | selectattr('crdb_region', 'equalto', crdb_region | default(''))
         | list | length
         if crdb_region is defined
         else (groups['crdb'] | default([]) | length) }}

- name: Install podman
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create config/secrets/state dirs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ kdc_conf_dir }}/config", mode: "0755" }
    - { path: "{{ kdc_conf_dir }}/secrets", mode: "0700" }
    - { path: "{{ kdc_state_dir }}", mode: "0755" }
    - { path: "{{ kdc_state_dir }}/run", mode: "0700" }
    - { path: /etc/containers/systemd, mode: "0755" }

- name: Render KDC config
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ kdc_conf_dir }}/config/{{ item }}"
    mode: "0644"
  loop: [kdc.conf, krb5.conf, kadm5.acl]
  notify:
    - try-restart krb5kdc
    - try-restart kadmind

- name: Install CRDB client certs (minted by crdb_certs)
  ansible.builtin.copy:
    src: "{{ kdc_local_secrets }}/{{ item.name }}"
    dest: "{{ kdc_conf_dir }}/secrets/{{ item.name }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: ca.crt, mode: "0644" }
    - { name: "client.{{ kdc_crdb_user }}.crt", mode: "0644" }
    - { name: "client.{{ kdc_crdb_user }}.key", mode: "0600" }
  notify:
    - try-restart krb5kdc
    - try-restart kadmind

- name: Map host arch to a nix system
  ansible.builtin.set_fact:
    _kdc_nix_system: >-
      {{ {'x86_64': 'x86_64-linux', 'aarch64': 'aarch64-linux'}[ansible_architecture] }}

- name: Build the KDC image on the controller (nix)
  ansible.builtin.command:
    cmd: >-
      nix build {{ kdc_image_flake }}#packages.{{ _kdc_nix_system }}.kdc-image
      --print-out-paths --no-link
  delegate_to: localhost
  become: false
  register: _kdc_image_build
  changed_when: false
  when: kdc_image_tar is not defined

- name: Ship image tarball
  ansible.builtin.copy:
    src: "{{ kdc_image_tar | default(_kdc_image_build.stdout_lines | last) }}"
    dest: "{{ kdc_state_dir }}/kdc-image.tar.gz"
    mode: "0644"
  register: _kdc_image_ship
  notify:
    - try-restart krb5kdc
    - try-restart kadmind

- name: Check image is loaded
  ansible.builtin.command: podman image exists {{ kdc_image_ref }}
  register: _kdc_image_have
  failed_when: _kdc_image_have.rc not in [0, 1]
  changed_when: false

- name: Load image into podman
  ansible.builtin.command: podman load -i {{ kdc_state_dir }}/kdc-image.tar.gz
  when: _kdc_image_ship.changed or _kdc_image_have.rc != 0

- name: Install krb5kdc quadlet
  ansible.builtin.template:
    src: krb5kdc.container.j2
    dest: /etc/containers/systemd/krb5kdc.container
    mode: "0644"
  notify:
    - kdc daemon-reload
    - try-restart krb5kdc

- name: Install kadmind quadlet (admin host only)
  ansible.builtin.template:
    src: kadmind.container.j2
    dest: /etc/containers/systemd/kadmind.container
    mode: "0644"
  notify:
    - kdc daemon-reload
    - try-restart kadmind
  when: inventory_hostname == kdc_admin_host

- name: Remove kadmind quadlet elsewhere
  ansible.builtin.file:
    path: /etc/containers/systemd/kadmind.container
    state: absent
  notify: kdc daemon-reload
  when: inventory_hostname != kdc_admin_host
