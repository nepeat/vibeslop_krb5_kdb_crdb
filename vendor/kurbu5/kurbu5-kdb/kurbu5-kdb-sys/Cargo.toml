[package]
name         = "kurbu5-kdb-sys"
version.workspace    = true
edition.workspace    = true
description  = "KDB plugin API re-export — thin wrapper over kurbu5-sys adding libkdb5 linkage"
license.workspace = true
repository.workspace = true
authors.workspace    = true
readme       = "../README.md"
keywords     = ["kerberos", "krb5", "kdb", "ffi", "sys"]
