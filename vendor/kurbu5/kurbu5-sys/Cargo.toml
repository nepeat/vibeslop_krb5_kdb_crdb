[package]
name         = "kurbu5-sys"
version.workspace    = true
edition.workspace    = true
description  = "Raw FFI bindings to the MIT Kerberos libkrb5 and KDB plugin API"
license.workspace = true
repository.workspace = true
authors.workspace    = true
keywords     = ["kerberos", "krb5", "ffi", "sys"]
categories   = ["external-ffi-bindings"]
# 'links' ensures Cargo enforces that exactly one crate in the build graph
# links against libkrb5, and it enables the use of DEP_KRB5_* env vars for
# downstream crates.
links        = "krb5"

# This crate does NOT inherit workspace lints because its main source file
# (lib.rs) is entirely auto-generated by bindgen and would trigger hundreds of
# pedantic warnings.  The #![allow(clippy::all)] in lib.rs handles the
# default clippy group; workspace = true would re-enable pedantic on top of it
# with no way to override at the package level.
[lints.clippy]
pedantic = "allow"

[build-dependencies]
bindgen.workspace    = true
pkg-config.workspace = true

[dependencies]
libc.workspace = true

# Feature flags for optional parts of the C API.
[features]
default = []
# Enables the internal MIT Kerberos OTP preauth types and encode/decode
# functions (encode_krb5_pa_otp_*, decode_krb5_pa_otp_*, k5_free_pa_otp_*).
# These are internal libkrb5 symbols (not in the public krb5.h) that are
# exported for plugin use.  Enable this feature when building a KDC or client
# OTP preauth plugin.
otp = []
