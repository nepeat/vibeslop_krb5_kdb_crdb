# rust2rpm configuration for kurbu5-kadm5-derive
# Proc-macro derives for kurbu5-kadm5-rs KADM5_AUTH and KADM5_HOOK interfaces.
# proc-macro = true; dependencies are syn, quote, proc-macro2 (all in Fedora).
# Features: kadm5_auth, kadm5_hook, full.

[package]
summary = "Derive macros for KADM5_AUTH and KADM5_HOOK plugin interfaces"
description = "Derive macros for MIT Kerberos KADM5_AUTH and KADM5_HOOK\nplugin modules implemented using the kurbu5-kadm5-rs crate."

[requires]
# krb5-devel and clang-devel needed transitively via kurbu5-sys bindgen.
# MIT Kerberos >= 1.22 is required for the KADM5 plugin API this workspace covers.
build = [
    "krb5-devel >= 1.22",
    "clang-devel",
    "pkgconf-pkg-config",
]
