[workspace.package]
version      = "0.1.3"
edition      = "2021"
license = "BSD-2-Clause"
repository   = "https://codeberg.org/abbra/kurbu5"
authors      = ["Alexander Bokovoy <ab@samba.org>"]

[workspace]
members = [
    "kurbu5-sys",
    "kurbu5-rs",
    "kurbu5-derive",
    "kurbu5-kdb/kurbu5-kdb-sys",
    "kurbu5-kdb/kurbu5-kdb-rs",
    "kurbu5-kdb/kurbu5-kdb-derive",
    "kurbu5-kdb/kurbu5-kdb-example",
    "kadm5/kurbu5-kadm5-sys",
    "kadm5/kurbu5-kadm5-rs",
    "kadm5/kurbu5-kadm5-derive",
]
resolver = "2"

[workspace.lints.clippy]
pedantic = "deny"

[workspace.dependencies]
libc        = "0.2"
bitflags    = "2"
bindgen     = "0.72"
pkg-config  = "0.3"
syn         = { version = "2", features = ["full"] }
quote       = "1"
proc-macro2 = "1"
