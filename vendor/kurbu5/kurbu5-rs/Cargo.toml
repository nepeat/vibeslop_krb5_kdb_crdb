[package]
name         = "kurbu5-rs"
version.workspace    = true
edition.workspace    = true
description  = "Safe, idiomatic Rust API for writing MIT Kerberos non-KDB plugin modules"
license.workspace = true
repository.workspace = true
authors.workspace    = true
readme       = "README.md"
keywords     = ["kerberos", "krb5", "plugin", "ffi"]
categories   = ["api-bindings", "authentication"]

[lints]
workspace = true

[dependencies]
kurbu5-sys    = { path = "../kurbu5-sys", version = "0.1" }
libc.workspace = true
kurbu5-derive = { path = "../kurbu5-derive", version = "0.1", optional = true }

[features]
# pwqual is enabled by default so that `cargo test --workspace` exercises
# the PWQUAL unit tests without requiring explicit --features flags.
default = ["pwqual"]

# Individual plugin interface features.
pwqual     = []
hostrealm  = []
localauth  = []
ccselect   = []
kdcpreauth = []
clpreauth  = []
kdcpolicy  = []
certauth   = []
audit      = []

# Enable the proc-macro derives for all interfaces.
derive = [
    "dep:kurbu5-derive",
    "kurbu5-derive/pwqual",
    "kurbu5-derive/hostrealm",
    "kurbu5-derive/localauth",
    "kurbu5-derive/ccselect",
    "kurbu5-derive/kdcpreauth",
    "kurbu5-derive/clpreauth",
    "kurbu5-derive/kdcpolicy",
    "kurbu5-derive/certauth",
    "kurbu5-derive/audit",
]

# Enable OTP preauth types and internal encode/decode/free symbols from kurbu5-sys.
otp = ["kurbu5-sys/otp"]

# Enable all plugin interfaces in one shot.
full = [
    "pwqual",
    "hostrealm",
    "localauth",
    "ccselect",
    "kdcpreauth",
    "clpreauth",
    "kdcpolicy",
    "certauth",
    "audit",
]

[[example]]
name = "pwqual_example"
required-features = ["pwqual"]
