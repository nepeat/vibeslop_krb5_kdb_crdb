# Temporary image registry for the tmp-crdb-krb5 scale test.
#
# Why in-cluster and not on the dev box: Talos containerd only pulls over
# verified HTTPS and we have no machine-config access to allow an insecure
# registry, so the registry sits behind traefik with a cert-manager LE
# cert instead. cloudflare-proxied is OFF on purpose: CF's proxy caps
# uploads, which breaks image layer pushes. htpasswd auth because the
# hostname resolves publicly (creds: k8s/.registry-pass on the dev box).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: tmp-crdb-krb5
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: tmp-crdb-krb5
spec:
  replicas: 1
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: registry:2
          env:
            - {name: REGISTRY_AUTH, value: htpasswd}
            - {name: REGISTRY_AUTH_HTPASSWD_REALM, value: registry}
            - {name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd}
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          ports:
            - {containerPort: 5000, name: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
            - {name: auth, mountPath: /auth, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: registry-data}
        - name: auth
          secret: {secretName: registry-htpasswd}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: tmp-crdb-krb5
spec:
  selector: {app: registry}
  ports:
    - {port: 5000, targetPort: 5000, name: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: tmp-crdb-krb5
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-genprog
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/target: sea1-traefik-k8s.generalprogramming.org
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik-helm
  rules:
    - host: registry-tmp-crdb.owo.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port: {number: 5000}
  tls:
    - hosts: [registry-tmp-crdb.owo.me]
      secretName: registry-tmp-crdb-tls
