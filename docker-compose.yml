# Local 3-"region" CockroachDB cluster for kdb-crdb dev/integration tests.
#
#   docker compose up -d            # cluster + certs + schema.sql
#   docker compose down -v          # teardown incl. data (certs: rm -rf e2e/.certs)
#
# One node per region, localities matching the region list in schema.sql,
# so the multi-region DDL (PRIMARY REGION / LOCALITY GLOBAL) exercises the
# real GLOBAL-table read path.
#
# SECURE mode: roach-cert generates a CA + node/client certs into
# ./e2e/.certs (bind mount, ca.crt world-readable for host clients); the
# cluster refuses plaintext connections outright. Host access is password
# auth over verify-full TLS (passwords are dev-only, set by roach-init).
#
# SQL: postgresql://krb5kdc:krb5kdc-dev-pw@localhost:26257/krb5?sslmode=verify-full&sslrootcert=e2e/.certs/ca.crt
# Admin UI: https://localhost:8081 (8080 tends to be taken on dev boxes)

x-crdb-node: &crdb-node
  image: cockroachdb/cockroach:latest-v25.2
  depends_on:
    roach-cert:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "curl", "-fk", "https://localhost:8080/health"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  # One-shot: CA + node cert (all hostnames incl. localhost for host
  # clients) + root client cert. Idempotent across restarts.
  roach-cert:
    image: cockroachdb/cockroach:latest-v25.2
    volumes:
      - ./e2e/.certs:/certs
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        cd /certs
        if [[ ! -f ca.crt ]]; then
          cockroach cert create-ca --certs-dir=/certs --ca-key=/certs/ca.key
          cockroach cert create-node roach-west roach-east roach-eu \
            localhost 127.0.0.1 --certs-dir=/certs --ca-key=/certs/ca.key
          cockroach cert create-client root --certs-dir=/certs --ca-key=/certs/ca.key
          chmod 644 ca.crt   # host-side psql/plugin only need the CA
        fi
        # Client cert for the plugin's SQL user (own guard: predates some
        # .certs dirs). Key world-readable so host tests can use it — DEV ONLY.
        if [[ ! -f client.krb5kdc.crt ]]; then
          cockroach cert create-client krb5kdc --certs-dir=/certs --ca-key=/certs/ca.key
          chmod 644 client.krb5kdc.crt client.krb5kdc.key
        fi
        # Receiver identity for kprop/iprop replica mode (own guard: predates
        # some .certs dirs). Key world-readable for host tests — DEV ONLY.
        if [[ ! -f client.krb5prop.crt ]]; then
          cockroach cert create-client krb5prop --certs-dir=/certs --ca-key=/certs/ca.key
          chmod 644 client.krb5prop.crt client.krb5prop.key
        fi
        echo 'certs ready'

  roach-west:
    <<: *crdb-node
    command: start --certs-dir=/certs --advertise-addr=roach-west --join=roach-west,roach-east,roach-eu --locality=region=us-west2
    ports:
      - "26257:26257"
      - "8081:8080"
    volumes:
      - ./e2e/.certs:/certs
      - roach-west-data:/cockroach/cockroach-data

  roach-east:
    <<: *crdb-node
    command: start --certs-dir=/certs --advertise-addr=roach-east --join=roach-west,roach-east,roach-eu --locality=region=us-east1
    ports:
      - "26258:26257"
    volumes:
      - ./e2e/.certs:/certs
      - roach-east-data:/cockroach/cockroach-data

  roach-eu:
    <<: *crdb-node
    command: start --certs-dir=/certs --advertise-addr=roach-eu --join=roach-west,roach-east,roach-eu --locality=region=europe-west4
    ports:
      - "26259:26257"
    volumes:
      - ./e2e/.certs:/certs
      - roach-eu-data:/cockroach/cockroach-data

  # One-shot: bootstrap the cluster (idempotent), apply schema.sql, set
  # dev passwords for host-side password-over-TLS auth.
  roach-init:
    image: cockroachdb/cockroach:latest-v25.2
    depends_on:
      - roach-west
      - roach-east
      - roach-eu
    volumes:
      - ./e2e/.certs:/certs
      - ./schema.sql:/schema.sql:ro
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        cockroach init --certs-dir=/certs --host=roach-west:26257 || true
        until cockroach sql --certs-dir=/certs --host=roach-west:26257 -e 'SELECT 1' >/dev/null 2>&1; do
          echo 'waiting for sql...'; sleep 1
        done
        cockroach sql --certs-dir=/certs --host=roach-west:26257 --file=/schema.sql
        cockroach sql --certs-dir=/certs --host=roach-west:26257 \
          -e "ALTER USER root WITH PASSWORD 'root-dev-pw'; ALTER USER krb5kdc WITH PASSWORD 'krb5kdc-dev-pw'; ALTER USER krb5prop WITH PASSWORD 'krb5prop-dev-pw'"
        echo 'schema applied'

volumes:
  roach-west-data:
  roach-east-data:
  roach-eu-data:
